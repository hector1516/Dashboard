# nginx del kiosco.
#
# Sirve tres cosas y solo tres:
#   1. el build de SvelteKit (SPA de una página),
#   2. /media/** desde el VOLUMEN (thumbs, wallpapers, avatares) — así las
#      fotos no pasan por Python,
#   3. /api/** hacia uvicorn.
#
# Y un detalle importante: `listen 80` sin TLS a propósito. Esta pantalla es
# de la red interna de la oficina y NO se publica en internet (no está en
# Cloudflare ni detrás de un dominio público): el TV abre
# http://dashboard.ecc-sa.com.mx:8101 por la red local.

server {
    listen 80;
    server_name dashboard.ecc-sa.com.mx localhost;

    # Los thumbs son JPEG: recomprimirlos con gzip no ayuda y quita CPU.
    client_max_body_size 2M;

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Medios: thumbs, wallpapers y avatares (desde el volumen) ────────────
    # Con nombre de archivo con hash de contenido (rep_<id>_<orden>_w960.jpg),
    # así que se pueden cachear para siempre: si el contenido cambia, cambia el
    # nombre (el snapshotter borra los thumbs viejos de 7 días).
    location /media/ {
        alias /data/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Snapshot crudo: respaldo si la API no está ─────────────────────────
    # El frontend intenta primero /api/dashboard/snapshot y cae a este. Con la
    # red o Python caídos, la pantalla igual abre.
    location = /snapshot.json {
        alias /data/snapshot.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        default_type application/json;
        access_log off;
    }

    # ── Build de la app ────────────────────────────────────────────────────
    location /_app/immutable/ {
        root /app/build;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # index.html nunca se cachea: es quien trae el index nuevo tras un hotsync.
    location = /index.html {
        root /app/build;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        root /app/build;
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 5;
}
