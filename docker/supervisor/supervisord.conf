; Supervisor del contenedor `dashboard`. Tres procesos y ni uno más:
;   nginx       → la pantalla y los medios
;   api         → 4 endpoints de lectura
;   snapshotter → el que calcula el snapshot
;
; OJO: Docker Compose no se usa a propósito. El despliegue de las apps ECCSA es
; `docker run` explícito (ver deploy/run_container.ps1) para que quede claro qué
; puertos y volúmenes tiene cada contenedor.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# Socket en la ruta estándar (/var/run/supervisor.sock) y no en /tmp: así
# `supervisorctl status` funciona SIN el flag -c, que es como lo busca todo el
# mundo (incluido el chequeo diario del shell). Con el socket en /tmp había que
# acordarse del -c, y el que no se acordaba veía "no such file" ycreas que
# supervisor estaba caído.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /app/docker/supervisor/*.conf
