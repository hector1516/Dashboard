[program:snapshotter]
command=/usr/local/bin/python3.11 -u /app/worker/snapshotter.py
directory=/app/worker
autostart=true
autorestart=true
startretries=3
startsecs=5
; Mata el proceso si se cuelga en un sleep largo (p. ej. la BD sin responder):
; el snapshotter espera en trozos de 20 s, pero el guardado de un snapshot
; podría tardar si hay muchos thumbs que generar.
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
