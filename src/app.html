<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<!-- Kiosco: pantalla fija 1920x1080, sin zoom ni scroll de usuario -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="theme-color" content="#0F172A" />
		<meta name="description" content="Centro de Operaciones ECCSA — pantalla de KPIs de la oficina" />

		<link rel="icon" type="image/x-icon" href="/favicon.ico" />

		<!--
			Tipografía self-hosted (OFL). A propósito, sin CDN: el kiosco tiene que
			verse igual con la red caída, y `system-ui` no es el diseño de ECCSA.
			Ver AGENTS.md §Offline.
		-->
		<style>
			@font-face {
				font-family: 'Outfit';
				font-style: normal;
				font-weight: 100 900;
				font-display: block;
				src: url('/fonts/Outfit-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
					U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
					U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Outfit';
				font-style: normal;
				font-weight: 100 900;
				font-display: block;
				src: url('/fonts/Outfit-latin-ext.woff2') format('woff2');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
					U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
					U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
					U+A720-A7FF;
			}
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!--
			Sin cache-bust aquí a propósito: la recarga por versión la hace la
			pantalla contra /api/dashboard/version (ver src/routes/+page.svelte),
			que sí sabe si el build del contenedor cambió. Un kiosco puede estar
			encendido días sin recargar, y esta es la única forma de que un
			hotsync se vea sin reiniciar Edge a mano.
		-->
	</body>
</html>
